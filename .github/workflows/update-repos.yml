name: Update README Repos
on:
  schedule:
    - cron: '0 */12 * * *' # every 12 hours (00:00 and 12:00 UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update README repos section
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const username = context.repo.owner;
            const excludeForks = true;
            const excludeArchived = true;
            const sortBy = 'updated';
            const per_page = 100;
            let page = 1;
            let repos = [];
            while (true) {
              const res = await github.rest.repos.listForUser({
                username,
                per_page,
                page,
              });
              repos = repos.concat(res.data);
              if (res.data.length < per_page) break;
              page++;
            }
            repos = repos.filter(r => !excludeForks || !r.fork)
                         .filter(r => !excludeArchived || !r.archived)
                         .filter(r => r.private === false);
            if (sortBy === 'stars') {
              repos.sort((a, b) => b.stargazers_count - a.stargazers_count);
            } else if (sortBy === 'name') {
              repos.sort((a, b) => a.name.localeCompare(b.name));
            } else {
              repos.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            }
            const header = '| Name | Description | Stars | Updated |\n|------|-------------|-------|---------|';
            const rows = repos.map(r => {
              const desc = r.description ? r.description.replace(/\n/g, ' ').replace(/\|/g, '\\|') : '';
              const stars = r.stargazers_count || '';
              const updated = new Date(r.updated_at).toISOString().split('T')[0];
              return `| [${r.name}](${r.html_url}) | ${desc} | ${stars} | ${updated} |`;
            }).join('\n');
            const table = header + '\n' + rows;
            const startMarker = '<!-- START:repos -->';
            const endMarker = '<!-- END:repos -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let readme;
            try {
              readme = await github.rest.repos.getContent({ owner, repo, path: 'README.md' });
            } catch (err) {
              const initial = `# I'm ${username}\n\n## Repositories\n\n${startMarker}\n${endMarker}\n`;
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path: 'README.md',
                message: 'chore: create README.md for repo list',
                content: Buffer.from(initial, 'utf8').toString('base64'),
              });
              readme = await github.rest.repos.getContent({ owner, repo, path: 'README.md' });
            }
            const content = Buffer.from(readme.data.content, 'base64').toString('utf8');
            let newContent;
            if (content.includes(startMarker) && content.includes(endMarker)) {
              const before = content.split(startMarker)[0];
              const after = content.split(endMarker)[1];
              newContent = before + startMarker + '\n' + table + '\n' + endMarker + after;
            } else {
              newContent = content + '\n' + startMarker + '\n' + table + '\n' + endMarker + '\n';
            }
            if (newContent === content) {
              console.log('README up-to-date; no changes to commit.');
            } else {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path: 'README.md',
                message: 'chore: update repos list',
                content: Buffer.from(newContent, 'utf8').toString('base64'),
                sha: readme.data.sha,
              });
              console.log('README updated with repo list.');
            }